name: ci

# CI mínimo de la skill (pasada 3, 2026-09-30): `npm test` (node:test) en cada push y PR.
# skills.sh instala desde `main` (`npx skills add jonathanleiva15/out-box-skills`), así que
# este es el único gate antes de que un cambio llegue a los usuarios: CRLF, presupuesto de
# SKILL.md, reglas de contrato con el worker (idempotencyEndpoints, dailyAppend, `daily`...).
# Sin dependencias ni lockfile: los tests solo usan node:*.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Tests (node --test)
        run: npm test
